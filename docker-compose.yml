version: '3.8'

services:
  postgres-db:
    image: postgres:16-alpine
    container_name: bibliotecahonorato_db
    restart: no
    environment:
      POSTGRES_DB: bibliotecahonorato_db
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U dev_user -d bibliotecahonorato_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local