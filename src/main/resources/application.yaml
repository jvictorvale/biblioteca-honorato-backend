spring:
  application:
    name: biblioteca-honorato-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/bibliotecahonorato_db
    username: dev_user
    password: dev_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations:
      - classpath:db/migration

  google:
    books:
      api:
        base-url: https://www.googleapis.com/books/v1
        key: ${GOOGLE_BOOKS_API_KEY:}

  server:
    port: 8080