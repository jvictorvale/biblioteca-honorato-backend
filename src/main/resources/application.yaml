spring:
  application:
    name: biblioteca-honorato-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bibliotecahonorato_db}
    username: ${DB_USER:dev_user}
    password: ${DB_PASSWORD:dev_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations:
      - classpath:db/migration

# Configurações customizadas da aplicação

api:
  security:
    jwt:
      secret: ${JWT_SECRET:secret_default_dev_apenas_para_ambiente_local_32_bytes}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    friend-token: ${FRIEND_ACCESS_TOKEN:amigos_secret_key_123}

  google:
    books:
      api:
        base-url: https://www.googleapis.com/books/v1
        key: ${GOOGLE_BOOKS_API_KEY:}

  server:
    port: ${PORT:8080}